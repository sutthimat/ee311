<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Faraday's Law of Induction</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#16202a;--mut:#56616e;--line:#d5dbe3;--acc:#1c64d6;--pos:#2b8a3e;--fs:clamp(11px,min(1.6vw,2.8vh),26px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:var(--fs)}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{padding:.3em .8em;display:flex;align-items:baseline;gap:1em;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:1.2em;margin:0;white-space:nowrap}
.cap{color:var(--mut);font-size:.9em;flex:1;min-width:0}.cap b{color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,31%);min-height:0}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
aside{background:var(--panel);border-left:1px solid var(--line);padding:.4em .7em;overflow:auto;display:flex;flex-direction:column;gap:.36em}
.row{display:grid;grid-template-columns:minmax(0,9.8em) minmax(0,1fr);align-items:center;gap:.5em}
.row label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{width:100%;accent-color:var(--acc);margin:0}
.seg{display:flex;gap:3px}
button{font:inherit;font-size:.88em;padding:.15em .4em;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:.35em;cursor:pointer;flex:1}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs button{font-weight:600}
.read{font-variant-numeric:tabular-nums;font-size:.9em;line-height:1.38;background:#f6f7f9;border-radius:.4em;padding:.25em .5em}
.fx{background:#eef3fb;border-radius:.4em;padding:.2em .5em;font-size:.95em;line-height:1.6}
.hint{color:var(--mut);font-size:.86em}
.grp{display:flex;flex-direction:column;gap:.36em}
</style>
</head>
<body>
<div id="app">
<header><h1 id="title"></h1><div class="cap" id="cap"></div></header>
<main>
<section id="stage"><canvas id="cv"></canvas></section>
<aside>
<div class="seg tabs"><button id="tabA" class="on">(a) Magnet &amp; coil</button><button id="tabB">(b) Sliding bar</button></div>
<div class="grp" id="gA">
<div class="seg" id="motSeg"><button data-k="pass" class="on">Pass through</button><button data-k="osc">Oscillate</button><button data-k="drag">Drag</button></div>
<div class="row"><label>speed v = <b id="vV"></b></label><input type="range" id="V" min="0.05" max="0.8" step="0.01" value="0.25"></div>
<div class="row"><label>N turns = <b id="vN"></b></label><input type="range" id="N" min="10" max="500" step="10" value="200"></div>
<div class="row"><label>m = <b id="vM"></b></label><input type="range" id="M" min="0.5" max="10" step="0.5" value="4"></div>
<div class="seg"><button id="flip">Flip magnet (N ↔ S)</button></div>
</div>
<div class="grp" id="gB" style="display:none">
<div class="row"><label>B = <b id="vBB"></b></label><input type="range" id="BB" min="0.1" max="2" step="0.05" value="0.8"></div>
<div class="row"><label>rail gap L = <b id="vBL"></b></label><input type="range" id="BL" min="0.1" max="0.5" step="0.01" value="0.3"></div>
<div class="row"><label>v = <b id="vBV"></b></label><input type="range" id="BV" min="-3" max="3" step="0.1" value="1.5"></div>
<div class="row"><label>R = <b id="vBR"></b></label><input type="range" id="BR" min="0.1" max="5" step="0.1" value="1"></div>
<div class="seg" id="drvSeg"><button data-d="const" class="on">Driven at constant v</button><button data-d="coast">Push &amp; release</button></div>
<div class="seg"><button id="resetB">↺ Reset bar</button></div>
</div>
<div class="read" id="read"></div>
<div class="fx" id="fx"></div>
<div class="hint" id="hint"></div>
</aside>
</main>
</div>

<script id="physics">
/* ===== Physics core (portable, no DOM). SI units. ===== */
const FAR = (function () {
  const MU0 = 4 * Math.PI * 1e-7;
  // Flux of a point magnetic dipole m (along +x, on the axis) through one circular turn of radius a, axial separation d
  // (by reciprocity with the on-axis field of the loop): Φ = μ0 m a² / (2 (a² + d²)^{3/2})
  const dipoleLoopFlux = (m, a, d) => (MU0 * m * a * a) / (2 * Math.pow(a * a + d * d, 1.5));
  const dipoleLoopFluxDeriv = (m, a, d) => (-3 * MU0 * m * a * a * d) / (2 * Math.pow(a * a + d * d, 2.5)); // dΦ/dd
  function turnPositions(N, len) { const p = []; for (let k = 0; k < N; k++) p.push(N === 1 ? 0 : -len / 2 + (len * (k + 0.5)) / N); return p; }
  // total flux linkage λ = Σ Φ_k for a coil centred at x = 0 (N turns spread over length len) with magnet at x
  function linkage(m, a, N, len, x) { return turnPositions(N, len).reduce((s, xk) => s + dipoleLoopFlux(m, a, xk - x), 0); }
  // analytic emf for magnet moving with velocity v: e = −dλ/dt = −Σ dΦ/dd · d(d)/dt, d = xk − x ⇒ d(d)/dt = −v
  function emfAnalytic(m, a, N, len, x, v) { return turnPositions(N, len).reduce((s, xk) => s + dipoleLoopFluxDeriv(m, a, xk - x) * v, 0); }
  // numeric emf by central difference of λ(t)
  function emfNumeric(lambdaOfT, t, h = 1e-5) { return -(lambdaOfT(t + h) - lambdaOfT(t - h)) / (2 * h); }
  // sliding bar: rails along x, separation L, B = B a_z, bar at x moving with v a_x, resistor at x = 0
  const barFlux = (B, L, x) => B * L * x;
  const barEmf = (B, L, v) => B * L * v;                 // magnitude of motional emf ∮(v×B)·dL
  const barCurrent = (B, L, v, R) => (B * L * v) / R;
  const barForce = (B, L, v, R) => -(B * B * L * L * v) / R; // magnetic force on the bar (opposes v)
  const barTau = (mass, B, L, R) => (mass * R) / (B * B * L * L); // coasting time constant
  return { MU0, dipoleLoopFlux, dipoleLoopFluxDeriv, turnPositions, linkage, emfAnalytic, emfNumeric, barFlux, barEmf, barCurrent, barForce, barTau };
})();
if (typeof module !== 'undefined') module.exports = FAR;
</script>

<script>
/* ===== UI ===== */
const $ = id => document.getElementById(id);
const tex = (el, s) => { if (window.katex) { try { katex.render(s, el, { throwOnError: false }); return; } catch (e) {} } el.textContent = s; };
function eng(v, u = '', p = 3) { if (!isFinite(v)) return '—'; if (Math.abs(v) < 1e-15) return '0 ' + u; const P = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n']]; const a = Math.abs(v); for (const [s, n] of P) if (a >= s * 0.9995) return parseFloat((v / s).toPrecision(p)) + ' ' + n + u; return v.toExponential(2) + ' ' + u; }
const cv = $('cv'), ctx = cv.getContext('2d');
const fsPx = () => parseFloat(getComputedStyle(document.documentElement).fontSize) || 18;
const COIL = { a: 0.02, len: 0.03, Rc: 5 };
const S = { tab: 'A', mot: 'pass', v: 0.25, N: 200, m: 4, sgn: 1, x: -0.15, t: 0, hist: [], dragX: null, emfF: 0, lastLam: null,
  B: { B: 0.8, L: 0.3, v: 1.5, R: 1, mode: 'const', x: 0.15, vel: 1.5, t: 0, hist: [], mass: 0.05 } };
function bind(id, fn, show) { const el = $(id), o = $('v' + id); const u = () => { fn(+el.value); o.innerHTML = show(+el.value); }; el.addEventListener('input', u); u(); }
bind('V', v => S.v = v, v => v.toFixed(2) + ' m/s');
bind('N', v => S.N = v, v => v);
bind('M', v => S.m = v, v => v.toFixed(1) + ' A·m²');
bind('BB', v => S.B.B = v, v => v.toFixed(2) + ' T');
bind('BL', v => S.B.L = v, v => (v * 100).toFixed(0) + ' cm');
bind('BV', v => { S.B.v = v; if (S.B.mode === 'const') S.B.vel = v; }, v => v.toFixed(1) + ' m/s');
bind('BR', v => S.B.R = v, v => v.toFixed(1) + ' Ω');
document.querySelectorAll('#motSeg button').forEach(b => b.onclick = () => { S.mot = b.dataset.k; document.querySelectorAll('#motSeg button').forEach(x => x.classList.toggle('on', x === b)); S.t = 0; S.hist = []; texts(); });
document.querySelectorAll('#drvSeg button').forEach(b => b.onclick = () => { S.B.mode = b.dataset.d; document.querySelectorAll('#drvSeg button').forEach(x => x.classList.toggle('on', x === b)); resetBar(); texts(); });
$('flip').onclick = () => { S.sgn = -S.sgn; S.hist = []; };
$('resetB').onclick = resetBar;
function resetBar() { S.B.x = S.B.v >= 0 ? 0.15 : 0.95; S.B.vel = S.B.v; S.B.t = 0; S.B.hist = []; }
$('tabA').onclick = () => setTab('A'); $('tabB').onclick = () => setTab('B');
function setTab(t) { S.tab = t; $('tabA').classList.toggle('on', t === 'A'); $('tabB').classList.toggle('on', t === 'B'); $('gA').style.display = t === 'A' ? 'flex' : 'none'; $('gB').style.display = t === 'B' ? 'flex' : 'none'; if (t === 'B') resetBar(); texts(); }
function texts() {
  let ti, cap, fx, hint;
  if (S.tab === 'A') {
    ti = "Faraday's law: magnet and coil";
    cap = '<b>Notice:</b> the emf is largest where the flux changes fastest (entering and leaving), and flips sign as the magnet passes; the induced current always opposes the change.';
    fx = '<span data-t="\\text{emf}=-N\\dfrac{d\\Phi}{dt}=\\oint\\mathbf E\\cdot d\\mathbf L"></span><br><span data-t="\\Phi_{\\text{turn}}=\\dfrac{\\mu_0 m\\,a^2}{2(a^2+d^2)^{3/2}}"></span>';
    hint = S.mot === 'drag' ? 'Drag the magnet left/right with the mouse.' : 'Coil: a = 2 cm, length 3 cm, R = 5 Ω. Green arrow i = induced current on the near side of the turns; dashed arrow = the field it creates.';
  } else {
    ti = 'Motional emf: sliding bar on rails';
    cap = S.B.mode === 'const' ? '<b>Notice:</b> emf = BLv; the induced current makes a force that opposes the motion — the agent must supply F·v = I²R.' : '<b>Notice:</b> with no driving force the magnetic drag slows the bar exponentially; its kinetic energy ends up as heat in R.';
    fx = '<span data-t="\\text{emf}=\\oint(\\mathbf v\\times\\mathbf B)\\cdot d\\mathbf L = -\\dfrac{d}{dt}(BLx)"></span><br><span data-t="|\\text{emf}|=BLv,\\quad I=\\dfrac{BLv}{R}"></span><br><span data-t="\\mathbf F=I\\mathbf L\\times\\mathbf B=-\\dfrac{B^2L^2}{R}\\,\\mathbf v"></span>';
    hint = 'B points out of the screen (⊙). Bar mass 50 g; rails and bar have no resistance. Animation at 0.3× real time. Drag the bar to move it by hand.';
  }
  $('title').textContent = ti; $('cap').innerHTML = cap; $('hint').innerHTML = hint; $('fx').innerHTML = fx; $('fx').querySelectorAll('[data-t]').forEach(e => tex(e, e.dataset.t));
}
function arrow(c, x1, y1, x2, y2, col, w, hl) { const dx = x2 - x1, dy = y2 - y1, m = Math.hypot(dx, dy) || 1, ux = dx / m, uy = dy / m; hl = hl || Math.max(6, w * 3.5); c.strokeStyle = c.fillStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2 - ux * hl * .6, y2 - uy * hl * .6); c.stroke(); c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - ux * hl - uy * hl * .45, y2 - uy * hl + ux * hl * .45); c.lineTo(x2 - ux * hl + uy * hl * .45, y2 - uy * hl - ux * hl * .45); c.closePath(); c.fill(); }
function sym(c, x, y, r, out, col, lw) { c.strokeStyle = c.fillStyle = col; c.lineWidth = lw; c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke(); if (out) { c.beginPath(); c.arc(x, y, r * .3, 0, 7); c.fill(); } else { const d = r * .6; c.beginPath(); c.moveTo(x - d, y - d); c.lineTo(x + d, y + d); c.moveTo(x + d, y - d); c.lineTo(x - d, y + d); c.stroke(); } }

// strip chart: series = [{data:[[t,v]], col, name, unit}]
function strip(x0, y0, w, h, series, tNow, span, fs, dpr, title) {
  ctx.fillStyle = '#f8f9fa'; ctx.fillRect(x0, y0, w, h); ctx.strokeStyle = '#dee2e6'; ctx.lineWidth = dpr; ctx.strokeRect(x0, y0, w, h);
  const L = x0 + 3.6 * fs, R = x0 + w - .6 * fs, T = y0 + 1.5 * fs, B = y0 + h - .6 * fs, mid = (T + B) / 2;
  ctx.fillStyle = '#16202a'; ctx.font = `${.8 * fs}px system-ui`; ctx.fillText(title, x0 + .4 * fs, y0 + 1.05 * fs);
  ctx.strokeStyle = '#8994a1'; ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, B); ctx.moveTo(L, mid); ctx.lineTo(R, mid); ctx.stroke();
  let lx = x0 + 9 * fs;
  for (const s of series) {
    let mx = 1e-12; for (const p of s.data) mx = Math.max(mx, Math.abs(p[1])); mx *= 1.15; if (s.fixed) mx = Math.max(mx, s.fixed);
    const X = t => R - (tNow - t) / span * (R - L), Y = v => mid - v / mx * (B - T) / 2;
    ctx.strokeStyle = s.col; ctx.lineWidth = 2.5 * dpr; ctx.beginPath(); let st = false;
    for (const p of s.data) { if (tNow - p[0] > span) continue; st ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])); st = true; } ctx.stroke();
    ctx.fillStyle = s.col; ctx.fillText(`${s.name}  (±${eng(mx, s.unit, 2)})`, lx, y0 + 1.05 * fs); lx += ctx.measureText(`${s.name}  (±${eng(mx, s.unit, 2)})`).width + 1.2 * fs;
  }
  ctx.fillStyle = '#56616e'; ctx.fillText('t →', R - 1.8 * fs, B - .3 * fs);
}

/* ---------- (a) magnet + coil ---------- */
function stepA(dt) {
  S.t += dt; const prev = S.x;
  if (S.mot === 'pass') { const span = 0.3; S.x = -0.15 + ((S.v * S.t) % span); if (S.x < prev) S.hist.push(null); }
  else if (S.mot === 'osc') { const A = 0.1, w = S.v / A; S.x = A * Math.sin(w * S.t); }
  else if (S.dragX !== null) S.x = S.dragX;
  const lam = S.sgn * FAR.linkage(S.m, COIL.a, S.N, COIL.len, S.x);
  let emf;
  if (S.mot === 'drag') { const raw = S.lastLam === null || dt <= 0 ? 0 : -(lam - S.lastLam) / dt; S.emfF += (raw - S.emfF) * Math.min(1, dt * 25); emf = S.emfF; }
  else { const vx = S.mot === 'pass' ? S.v : S.v * Math.cos((S.v / 0.1) * S.t); emf = S.sgn * FAR.emfAnalytic(S.m, COIL.a, S.N, COIL.len, S.x, vx); }
  S.lastLam = lam;
  S.hist.push([S.t, lam, emf]); while (S.hist.length && (S.hist[0] === null || S.t - S.hist[0][0] > 4)) S.hist.shift();

}
function drawA(dt) {
  const W = cv.width, Hh = cv.height, dpr = window.devicePixelRatio || 1, fs = fsPx() * dpr;
  const { lam, emf } = stepA(dt);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, Hh);
  const sceneH = Hh * 0.52, sc = W / 0.36, cx = W / 2, cy = sceneH / 2 + .5 * fs;
  const P = x => cx + x * sc;
  // coil (drawn as N_vis ellipses)
  const nv = 9, a = COIL.a * sc, ew = a * 0.32, I = emf / COIL.Rc;
  const xs = FAR.turnPositions(nv, COIL.len);
  ctx.lineWidth = 3 * dpr;
  for (const xk of xs) { ctx.strokeStyle = '#c07a3a'; ctx.beginPath(); ctx.ellipse(P(xk), cy, ew, a, 0, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke(); }

  const ml = 0.05 * sc, mh = 0.022 * sc, mx = P(S.x);
  const nRight = S.sgn > 0;
  ctx.fillStyle = nRight ? '#868e96' : '#c92a2a'; ctx.fillRect(mx - ml / 2, cy - mh / 2, ml / 2, mh);
  ctx.fillStyle = nRight ? '#c92a2a' : '#868e96'; ctx.fillRect(mx, cy - mh / 2, ml / 2, mh);
  ctx.fillStyle = '#fff'; ctx.font = `bold ${fs}px system-ui`; ctx.textAlign = 'center';
  ctx.fillText(nRight ? 'S' : 'N', mx - ml / 4, cy + .35 * fs); ctx.fillText(nRight ? 'N' : 'S', mx + ml / 4, cy + .35 * fs); ctx.textAlign = 'left';
  // front half of coil over the magnet
  for (const xk of xs) { ctx.strokeStyle = '#d9480f'; ctx.lineWidth = 3 * dpr; ctx.beginPath(); ctx.ellipse(P(xk), cy, ew, a, 0, -Math.PI * 0.5, Math.PI * 0.5); ctx.stroke(); }

  const Imax = Math.abs(S.sgn * FAR.emfAnalytic(S.m, COIL.a, S.N, COIL.len, -0.012, S.v)) / COIL.Rc + 1e-12, q = Math.min(1, Math.abs(I) / Imax);
  if (q > 0.03) {
    const dir = I > 0 ? 1 : -1, xx = P(xs[nv - 1]) + ew + .9 * fs, L = (0.6 + 1.6 * q) * fs;
    arrow(ctx, xx, cy - dir * L / 2, xx, cy + dir * L / 2, '#2b8a3e', 3.5 * dpr);
    ctx.fillStyle = '#2b8a3e'; ctx.font = `bold ${.85 * fs}px system-ui`; ctx.fillText('i', xx + .4 * fs, cy + .3 * fs);
    // induced B on axis (opposes change of flux)
    const bl = (1.5 + 3 * q) * fs; ctx.setLineDash([6 * dpr, 4 * dpr]); arrow(ctx, cx - dir * bl / 2, cy - a - 1.4 * fs, cx + dir * bl / 2, cy - a - 1.4 * fs, '#2b8a3e', 2.5 * dpr); ctx.setLineDash([]);
    ctx.fillText('B_induced', cx - 2.8 * fs, cy - a - 2.2 * fs);

  arrow(ctx, mx - ml * .3 * S.sgn, cy + mh / 2 + 1 * fs, mx + ml * .3 * S.sgn, cy + mh / 2 + 1 * fs, '#1c64d6', 2.5 * dpr); ctx.fillStyle = '#1c64d6'; ctx.font = `${.8 * fs}px system-ui`; ctx.fillText('m', mx + .4 * fs, cy + mh / 2 + 2.3 * fs);
  // scale + resistor note
  ctx.fillStyle = '#56616e'; ctx.fillRect(fs, sceneH - .4 * fs, 0.05 * sc, 3 * dpr); ctx.fillText('5 cm', fs, sceneH - .8 * fs);
  // charts

  strip(.4 * fs, sceneH + .2 * fs, W - .8 * fs, ch - .2 * fs, [{ data: hs.map(p => [p[0], p[1]]), col: '#1c64d6', name: 'flux linkage λ = NΦ', unit: 'Wb·t' }], S.t, 4, fs, dpr, 'λ(t)');
  strip(.4 * fs, sceneH + ch + .4 * fs, W - .8 * fs, ch - .2 * fs, [{ data: hs.map(p => [p[0], p[2]]), col: '#c92a2a', name: 'emf = −dλ/dt', unit: 'V' }], S.t, 4, fs, dpr, 'emf(t)');
  $('read').innerHTML = `magnet x = ${(S.x * 100).toFixed(1)} cm<br>λ = NΦ = <b>${eng(lam, 'Wb·t')}</b><br>emf = <b>${eng(emf, 'V')}</b><br>i = emf/R = ${eng(I, 'A')}`;
}

/* ---------- (b) sliding bar ---------- */
function drawB(dt) {
  const W = cv.width, Hh = cv.height, dpr = window.devicePixelRatio || 1, fs = fsPx() * dpr, b = S.B;
  dt *= SLOWB; b.t += dt;
  if (!draggingBar) {
    if (b.mode === 'const') b.vel = b.v; else b.vel *= Math.exp(-dt / FAR.barTau(b.mass, b.B, b.L, b.R));
    b.x += b.vel * dt;

  }
  const emf = FAR.barEmf(b.B, b.L, b.vel), I = FAR.barCurrent(b.B, b.L, b.vel, b.R), F = FAR.barForce(b.B, b.L, b.vel, b.R), Phi = FAR.barFlux(b.B, b.L, b.x);
  b.hist.push([b.t, Phi, emf, b.vel]); while (b.hist.length && b.t - b.hist[0][0] > 6) b.hist.shift();
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, Hh);
  const sceneH = Hh * 0.52, x0 = 2.5 * fs, xr = W - 1.5 * fs, sc = (xr - x0) / 1.05, cy = sceneH / 2 + .3 * fs, hl = Math.min(sceneH * 0.4, b.L / 0.5 * sceneH * 0.4) ;
  const yTop = cy - hl, yBot = cy + hl, bx = x0 + b.x * sc;
  // B dots
  const g = 2.6 * fs; for (let y = g / 2 + .2 * fs; y < sceneH; y += g) for (let x = g / 2; x < W; x += g) sym(ctx, x, y, .22 * fs, true, 'rgba(90,60,170,.3)', 1.2 * dpr);
  // flux area
  ctx.fillStyle = 'rgba(28,100,214,.10)'; ctx.fillRect(x0, yTop, bx - x0, yBot - yTop);
  // rails
  ctx.strokeStyle = '#495057'; ctx.lineWidth = 5 * dpr; ctx.beginPath(); ctx.moveTo(x0, yTop); ctx.lineTo(xr, yTop); ctx.moveTo(x0, yBot); ctx.lineTo(xr, yBot); ctx.stroke();
  // resistor (zig-zag) at left
  ctx.lineWidth = 3 * dpr; ctx.beginPath(); ctx.moveTo(x0, yTop); const zz = 8, zh = (yBot - yTop) * 0.5, zs = yTop + (yBot - yTop) * 0.25; ctx.lineTo(x0, zs); for (let k = 0; k < zz; k++) ctx.lineTo(x0 + (k % 2 ? -1 : 1) * .6 * fs, zs + zh * (k + .5) / zz); ctx.lineTo(x0, zs + zh); ctx.lineTo(x0, yBot); ctx.stroke();
  ctx.fillStyle = '#16202a'; ctx.font = `bold ${.9 * fs}px system-ui`; ctx.fillText('R', x0 - 2 * fs, cy + .3 * fs);
  // bar
  ctx.fillStyle = '#c07a3a'; ctx.fillRect(bx - .45 * fs, yTop - .9 * fs, .9 * fs, yBot - yTop + 1.8 * fs);
  // velocity arrow
  if (Math.abs(b.vel) > 1e-3) { const vl = Math.min(6, Math.abs(b.vel) * 2.2) * fs * Math.sign(b.vel); arrow(ctx, bx, yTop - 1.8 * fs, bx + vl, yTop - 1.8 * fs, '#2b8a3e', 3 * dpr); ctx.fillStyle = '#2b8a3e'; ctx.fillText('v', bx + vl + .3 * Math.sign(vl) * fs, yTop - 1.5 * fs); }
  // force arrow
  if (Math.abs(F) > 1e-4) { const fl = Math.min(6, Math.abs(F) / 0.5 * 2) * fs * Math.sign(F) + .8 * fs * Math.sign(F); arrow(ctx, bx, yBot + 1.8 * fs, bx + fl, yBot + 1.8 * fs, '#c92a2a', 3 * dpr); ctx.fillStyle = '#c92a2a'; ctx.fillText('F_mag', bx + fl + (F > 0 ? .3 : -3.6) * fs, yBot + 2.1 * fs); }
  // current arrows: in the bar current flows −y (down on screen... y up = screen up) when v>0 → on screen: downward
  if (Math.abs(I) > 1e-4) {
    const d = I > 0 ? 1 : -1, q = Math.min(1, Math.abs(I) / 2), col = `rgba(217,72,15,${0.5 + 0.5 * q})`;
    arrow(ctx, bx + 1.2 * fs, cy - d * 1.2 * fs, bx + 1.2 * fs, cy + d * 1.2 * fs, col, 3 * dpr);              // bar: down for I>0
    const xm = (x0 + bx) / 2; arrow(ctx, xm + d * fs, yBot + .7 * fs, xm - d * fs, yBot + .7 * fs, col, 3 * dpr); // bottom rail: toward R
    arrow(ctx, xm - d * fs, yTop - .7 * fs, xm + d * fs, yTop - .7 * fs, col, 3 * dpr);                            // top rail: toward bar
    ctx.fillStyle = '#d9480f'; ctx.fillText('I', bx + 1.9 * fs, cy + .3 * fs);
  }
  ctx.fillStyle = '#1c64d6'; ctx.font = `${.8 * fs}px system-ui`; ctx.fillText('Φ = B·L·x', x0 + 1.2 * fs, cy + .3 * fs);
  { const dx = Math.min(xr - 1.2 * fs, bx + 4 * fs); ctx.strokeStyle = '#56616e'; ctx.lineWidth = 1.5 * dpr; arrow(ctx, dx, cy, dx, yTop + 2, '#56616e', 1.5 * dpr, .6 * fs); arrow(ctx, dx, cy, dx, yBot - 2, '#56616e', 1.5 * dpr, .6 * fs); ctx.fillStyle = '#56616e'; ctx.fillText('L', dx + .4 * fs, cy + .3 * fs); }
  // charts
  const ch = (Hh - sceneH - .6 * fs) / 2, hs = b.hist;
  strip(.4 * fs, sceneH + .2 * fs, W - .8 * fs, ch - .2 * fs, [{ data: hs.map(p => [p[0], p[1]]), col: '#1c64d6', name: 'Φ = BLx', unit: 'Wb', fixed: 1e-3 }], b.t, 2.5, fs, dpr, 'Φ(t)');
  strip(.4 * fs, sceneH + ch + .4 * fs, W - .8 * fs, ch - .2 * fs, [{ data: hs.map(p => [p[0], p[2]]), col: '#c92a2a', name: 'emf = BLv (= dΦ/dt in size)', unit: 'V', fixed: 1e-3 }], b.t, 2.5, fs, dpr, 'emf(t)');
  $('read').innerHTML = `x = ${(b.x * 100).toFixed(0)} cm &nbsp; Φ = ${eng(Phi, 'Wb')}<br>|emf| = BLv = <b>${eng(Math.abs(emf), 'V')}</b><br>I = BLv/R = <b>${eng(Math.abs(I), 'A')}</b><br>F<sub>mag</sub> = ${eng(F, 'N')} (opposes v)<br>P = I²R = ${eng(I * I * b.R, 'W')} = |F·v| = ${eng(Math.abs(F * b.vel), 'W')}` + (b.mode === 'coast' ? `<br>τ = mR/(B²L²) = ${eng(FAR.barTau(b.mass, b.B, b.L, b.R), 's')}` : '');
}

let last = performance.now(), draggingBar = false; const SLOWB = 0.3; // sliding-bar animation runs at 0.3× real time
function frame(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; if (S.tab === 'A') drawA(dt); else drawB(dt); requestAnimationFrame(frame); }
let dragPrev = null;
function worldFromEvent(e) { const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1, px = (e.clientX - r.left) * dpr, W = cv.width, fs = fsPx() * dpr; return S.tab === 'A' ? (px - W / 2) / (W / 0.36) : (px - 2.5 * fs) / ((W - 1.5 * fs - 2.5 * fs) / 1.05); }
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); const x = worldFromEvent(e); if (S.tab === 'A') { if (S.mot !== 'drag') { S.mot = 'drag'; document.querySelectorAll('#motSeg button').forEach(b => b.classList.toggle('on', b.dataset.k === 'drag')); texts(); } S.dragX = Math.max(-0.17, Math.min(0.17, x)); } else { draggingBar = true; dragPrev = [x, performance.now()]; } });
cv.addEventListener('pointermove', e => { const x = worldFromEvent(e); if (S.tab === 'A' && S.mot === 'drag' && e.buttons) S.dragX = Math.max(-0.17, Math.min(0.17, x)); if (S.tab === 'B' && draggingBar) { const now = performance.now(), xc = Math.max(0.08, Math.min(1.0, x)), dtt = (now - dragPrev[1]) / 1000; if (dtt > 0) S.B.vel = S.B.vel * 0.6 + 0.4 * (xc - S.B.x) / (dtt * SLOWB); S.B.x = xc; dragPrev = [xc, now]; } });
cv.addEventListener('pointerup', () => { if (draggingBar) { draggingBar = false; if (S.B.mode === 'const') S.B.vel = S.B.v; } });
new ResizeObserver(() => { const dpr = window.devicePixelRatio || 1; cv.width = Math.max(1, Math.round(cv.clientWidth * dpr)); cv.height = Math.max(1, Math.round(cv.clientHeight * dpr)); }).observe($('stage'));
texts(); window.addEventListener('load', texts);
requestAnimationFrame(frame);
</script>
</body>
