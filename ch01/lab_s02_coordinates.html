<style>

main{display:grid;grid-template-columns:minmax(0,1fr) minmax(15rem,23rem);min-height:0}

.small{font-size:1rem;color:var(--muted)}

<style>

</head>
<body>
<div id="app">
<header>
  <h1>Coordinate systems &amp; unit vectors</h1>
  <p class="notice"><b>Notice:</b> curvilinear unit vectors <b>change direction</b> with position; angle increments give edges ρdφ, r dθ, r sinθ dφ.</p>
</header>
<main>
  <div id="stage"><div id="labels"></div><div class="hint">Drag to rotate · wheel to zoom</div></div>
  <aside>
    <div class="btns"><button id="mCyl" class="on">Cylindrical</button><button id="mSph">Spherical</button></div>
    <div id="cylCtl">
      <div class="row"><label>ρ</label><input type="range" id="rho" min="0.3" max="4" step="0.05" value="2.5"><span class="val" id="rho-v"></span></div>
      <div class="row"><label>φ</label><input type="range" id="phiC" min="0" max="360" step="1" value="20"><span class="val" id="phiC-v"></span></div>
      <div class="row"><label>z</label><input type="range" id="z" min="-2" max="3" step="0.05" value="1.5"><span class="val" id="z-v"></span></div>
    </div>
    <div id="sphCtl" style="display:none">
      <div class="row"><label>r</label><input type="range" id="r" min="0.3" max="4" step="0.05" value="3"><span class="val" id="r-v"></span></div>
      <div class="row"><label>θ</label><input type="range" id="th" min="1" max="179" step="1" value="50"><span class="val" id="th-v"></span></div>
      <div class="row"><label>φ</label><input type="range" id="phiS" min="0" max="360" step="1" value="20"><span class="val" id="phiS-v"></span></div>
    </div>
    <div>
      <label class="chk"><input type="checkbox" id="tVol" checked>Volume element</label>
      <label class="chk"><input type="checkbox" id="tSurf" checked>Coord. surfaces</label>
      <label class="chk"><input type="checkbox" id="tRing">Unit vectors around a ring</label>
    </div>
    <div id="dRow"><div class="row"><label id="dLenLbl">dρ, dz</label><input type="range" id="dsz" min="0.05" max="0.8" step="0.01" value="0.6"><span class="val" id="dsz-v"></span></div>
    <div class="row"><label id="dAngLbl">dφ</label><input type="range" id="dang" min="1" max="30" step="1" value="15"><span class="val" id="dang-v"></span></div></div>
    <table class="ro" id="tbl"></table>
    <div class="small" id="volNote">Shrink d: product formula → exact volume.</div>
    <div class="formula" id="fml"></div>
  </aside>
</main>
</div>

<!-- ===================== PHYSICS / MATH (pure, no DOM) ===================== -->
<script id="physics">
var PHYS = (function () {
  const cos = Math.cos, sin = Math.sin;
  // cylindrical (rho, phi, z) -> cartesian
  const cylToCart = (rho, phi, z) => [rho * cos(phi), rho * sin(phi), z];
  // spherical (r, theta, phi) -> cartesian (theta from +z, phi from +x)
  const sphToCart = (r, th, phi) => [r * sin(th) * cos(phi), r * sin(th) * sin(phi), r * cos(th)];
  // local unit vectors, Cartesian components
  const cylUnit = (phi) => ({ a_rho: [cos(phi), sin(phi), 0], a_phi: [-sin(phi), cos(phi), 0], a_z: [0, 0, 1] });
  const sphUnit = (th, phi) => ({
    a_r: [sin(th) * cos(phi), sin(th) * sin(phi), cos(th)],
    a_th: [cos(th) * cos(phi), cos(th) * sin(phi), -sin(th)],
    a_phi: [-sin(phi), cos(phi), 0]
  });
  // edge lengths of the differential element (metric/scale factors x increments)
  const cylEdges = (rho, d) => ({ drho: d.drho, rhodphi: rho * d.dphi, dz: d.dz });
  const sphEdges = (r, th, d) => ({ dr: d.dr, rdth: r * d.dth, rsinthdphi: r * Math.sin(th) * d.dphi });
  const cylDV = (rho, d) => rho * d.drho * d.dphi * d.dz;
  const sphDV = (r, th, d) => r * r * Math.sin(th) * d.dr * d.dth * d.dphi;
  // exact volume of a finite element (closed forms) for checking dV
  const cylVolExact = (rho, d) => 0.5 * ((rho + d.drho) ** 2 - rho * rho) * d.dphi * d.dz;
  const sphVolExact = (r, th, d) => ((r + d.dr) ** 3 - r ** 3) / 3 * (Math.cos(th) - Math.cos(th + d.dth)) * d.dphi;
  return { cylToCart, sphToCart, cylUnit, sphUnit, cylEdges, sphEdges, cylDV, sphDV, cylVolExact, sphVolExact };
})();
</script>
<script id="ui">
/* ===== Shared UI helpers (DOM / canvas only, no physics) ===== */
var UI = (function () {
  const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize) || 18;
  const $ = (s) => document.querySelector(s);

  // ---------- KaTeX ----------
  function renderTex(root) {
    (root || document).querySelectorAll('.tex').forEach((el) => {
      if (el.dataset.src == null) el.dataset.src = el.textContent.trim();
      if (window.katex) {
        try { katex.render(el.dataset.src, el, { displayMode: el.classList.contains('d'), throwOnError: false }); } catch (e) { el.textContent = el.dataset.src; }
      }
    });
  }
  function setTex(el, src) {
    if (typeof el === 'string') el = $(el);
    if (!el) return;
    if (el.dataset.src === src && el.dataset.done) return;
    el.dataset.src = src;
    if (window.katex) { try { katex.render(src, el, { displayMode: el.classList.contains('d'), throwOnError: false }); el.dataset.done = 1; } catch (e) { el.textContent = src; } }
    else el.textContent = src;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => renderTex());
  else renderTex();
  window.addEventListener('load', () => renderTex());

  // ---------- number formatting ----------
  const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
  const sup = (n) => String(n).split('').map((c) => SUP[c] || c).join('');
  function sci(x, d) {
    d = d == null ? 3 : d;
    if (!isFinite(x)) return x > 0 ? '∞' : (x < 0 ? '−∞' : '—');
    if (x === 0) return '0';
    const e = Math.floor(Math.log10(Math.abs(x)));
    if (e >= -2 && e <= 3) return minus(x.toPrecision(d));
    const m = x / Math.pow(10, e);
    return minus(m.toFixed(d - 1)) + '×10' + sup(e);
  }
  function minus(s) { return String(s).replace(/^-/, '−'); }
  const PFX = [[1e9, 'G'], [1e6, 'M'], [1e3, 'k'], [1, ''], [1e-3, 'm'], [1e-6, 'µ'], [1e-9, 'n'], [1e-12, 'p'], [1e-15, 'f']];
  function si(x, unit, d) {
    d = d == null ? 3 : d;
    if (!isFinite(x)) return '—';
    if (Math.abs(x) < 1e-18) return '0 ' + unit;
    const a = Math.abs(x);
    for (const [f, p] of PFX) if (a >= f * 0.9995) { const v = x / f; return minus(Math.abs(v) >= Math.pow(10, d) ? v.toFixed(0) : v.toPrecision(d)) + ' ' + p + unit; }
    return sci(x, d) + ' ' + unit;
  }
  function fix(x, n) { return minus((Math.abs(x) < 0.5 * Math.pow(10, -n) ? 0 : x).toFixed(n)); }

  // ---------- canvas ----------
  function canvas2d(canvas, draw) {
    const ctx = canvas.getContext('2d');
    const obj = { ctx, W: 1, H: 1, dpr: 1, redraw };
    let pending = false;
    function resize() {
      const r = canvas.getBoundingClientRect();
      obj.dpr = window.devicePixelRatio || 1;
      obj.W = Math.max(1, r.width); obj.H = Math.max(1, r.height);
      canvas.width = Math.round(obj.W * obj.dpr); canvas.height = Math.round(obj.H * obj.dpr);
      ctx.setTransform(obj.dpr, 0, 0, obj.dpr, 0, 0);
      draw(obj);
    }
    function redraw() {
      if (pending) return; pending = true;
      requestAnimationFrame(() => { pending = false; ctx.setTransform(obj.dpr, 0, 0, obj.dpr, 0, 0); draw(obj); });
    }
    new ResizeObserver(resize).observe(canvas);
    return obj;
  }

  // world <-> screen mapping that keeps aspect ratio 1:1
  function View(xmin, xmax, ymin, ymax) { this.box = [xmin, xmax, ymin, ymax]; this.fit(0, 0, 100, 100); }
  View.prototype.fit = function (px, py, W, H) {
    const [x0, x1, y0, y1] = this.box;
    this.s = Math.min(W / (x1 - x0), H / (y1 - y0));
    this.cx = (x0 + x1) / 2; this.cy = (y0 + y1) / 2;
    this.ox = px + W / 2; this.oy = py + H / 2;
    this.rect = [px, py, W, H];
    this.xmin = this.cx - W / 2 / this.s; this.xmax = this.cx + W / 2 / this.s;
    this.ymin = this.cy - H / 2 / this.s; this.ymax = this.cy + H / 2 / this.s;
    return this;
  };
  View.prototype.X = function (x) { return this.ox + (x - this.cx) * this.s; };
  View.prototype.Y = function (y) { return this.oy - (y - this.cy) * this.s; };
  View.prototype.toW = function (px, py) { return [this.cx + (px - this.ox) / this.s, this.cy - (py - this.oy) / this.s]; };

  function arrow(ctx, x1, y1, x2, y2, color, width, head) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
    if (L < 0.5) return;
    head = Math.min(head == null ? 10 : head, L * 0.6);
    const ux = dx / L, uy = dy / L;
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width || 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - ux * head * 0.7, y2 - uy * head * 0.7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - ux * head - uy * head * 0.45, y2 - uy * head + ux * head * 0.45);
    ctx.lineTo(x2 - ux * head + uy * head * 0.45, y2 - uy * head - ux * head * 0.45);
    ctx.closePath(); ctx.fill();
  }

  function label(ctx, text, x, y, opt) {
    opt = opt || {};
    const fs = (opt.size || 1) * rem();
    ctx.font = (opt.bold ? '600 ' : '') + fs + 'px ' + (opt.font || 'system-ui, sans-serif');
    ctx.textAlign = opt.align || 'left'; ctx.textBaseline = opt.base || 'middle';
    if (opt.bg) {
      const w = ctx.measureText(text).width, pad = 0.2 * fs;
      let bx = x - (ctx.textAlign === 'center' ? w / 2 : ctx.textAlign === 'right' ? w : 0);
      let by = y - (ctx.textBaseline === 'middle' ? fs * 0.6 : ctx.textBaseline === 'bottom' ? fs * 1.15 : 0);
      ctx.fillStyle = opt.bg; ctx.fillRect(bx - pad, by - pad * 0.3, w + 2 * pad, fs * 1.2 + pad * 0.6);
    }
    ctx.fillStyle = opt.color || '#16181d';
    ctx.fillText(text, x, y);
  }

  // pointer helper: handlers receive canvas-local px coords
  function pointer(canvas, h) {
    let dragging = false;
    const loc = (e) => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    canvas.addEventListener('pointerdown', (e) => {
      const [x, y] = loc(e);
      if (h.down && h.down(x, y, e)) { dragging = true; canvas.setPointerCapture(e.pointerId); e.preventDefault(); }
    });
    canvas.addEventListener('pointermove', (e) => {
      const [x, y] = loc(e);
      if (dragging) { h.move && h.move(x, y, e); e.preventDefault(); }
      else if (h.hover) canvas.style.cursor = h.hover(x, y) ? 'grab' : 'default';
    });
    const end = (e) => { if (dragging) { dragging = false; h.up && h.up(e); } };
    canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  }

  // slider binding: <input type=range id=...> and <span id=...-v>
  function range(id, fmt, cb, toVal) {
    const el = document.getElementById(id), out = document.getElementById(id + '-v');
    toVal = toVal || ((v) => v);
    const upd = (fire) => { const v = toVal(parseFloat(el.value)); if (out) out.textContent = fmt(v); if (fire) cb(v); return v; };
    el.addEventListener('input', () => upd(true));
    upd(false);
    return { get: () => toVal(parseFloat(el.value)), set: (raw) => { el.value = raw; upd(false); }, el };
  }

  // ---------- log/linear plot ----------
  function niceTicks(a, b, n) {
    const span = b - a, step0 = span / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const r = step0 / mag, step = (r < 1.5 ? 1 : r < 3.5 ? 2 : r < 7.5 ? 5 : 10) * mag;
    const out = []; for (let t = Math.ceil(a / step - 1e-9) * step; t <= b + 1e-9 * span; t += step) out.push(Math.abs(t) < step * 1e-9 ? 0 : t);
    return out;
  }
  function plot(ctx, rect, o) {
    const R = rem();
    const [px, py, W, H] = rect;
    const ml = o.ml != null ? o.ml : 4.2 * R, mb = 2.6 * R, mt = o.mt != null ? o.mt : 0.6 * R, mr = 0.8 * R;
    const x0 = px + ml, x1 = px + W - mr, y0 = py + mt, y1 = py + H - mb;
    const lx = !!o.logx, ly = !!o.logy;
    const tx = (v) => lx ? Math.log10(v) : v, ty = (v) => ly ? Math.log10(v) : v;
    const [xa, xb] = o.xr.map(tx), [ya, yb] = o.yr.map(ty);
    const X = (v) => x0 + (tx(v) - xa) / (xb - xa) * (x1 - x0);
    const Y = (v) => y1 - (ty(v) - ya) / (yb - ya) * (y1 - y0);
    const invX = (p) => { const t = xa + (p - x0) / (x1 - x0) * (xb - xa); return lx ? Math.pow(10, t) : t; };
    ctx.save();
    ctx.fillStyle = '#fff'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    if (o.shade) for (const s of o.shade) {
      const a = Math.max(x0, X(s[0])), b = Math.min(x1, X(s[1]));
      if (b > a) { ctx.fillStyle = s[2] || 'rgba(18,128,74,0.12)'; ctx.fillRect(a, y0, b - a, y1 - y0); }
    }
    // grid + ticks
    ctx.lineWidth = 1; ctx.font = R + 'px system-ui, sans-serif'; ctx.fillStyle = '#4d535e';
    const xt = lx ? (() => { const t = []; for (let e = Math.ceil(xa - 1e-9); e <= xb + 1e-9; e++) t.push(e); return t; })() : niceTicks(xa, xb, Math.max(2, Math.floor((x1 - x0) / (5 * R))));
    const yt = ly ? (() => { const t = []; for (let e = Math.ceil(ya - 1e-9); e <= yb + 1e-9; e++) t.push(e); return t; })() : niceTicks(ya, yb, Math.max(2, Math.floor((y1 - y0) / (2.5 * R))));
    const xstep = Math.max(1, Math.ceil(xt.length / Math.max(2, (x1 - x0) / (3.6 * R))));
    const ystep = Math.max(1, Math.ceil(yt.length / Math.max(2, (y1 - y0) / (1.6 * R))));
    if (lx) { ctx.strokeStyle = '#eeebe4'; for (let e = Math.floor(xa); e < xb; e++) for (let k = 2; k < 10; k++) { const v = e + Math.log10(k); if (v > xa && v < xb) { const p = x0 + (v - xa) / (xb - xa) * (x1 - x0); ctx.beginPath(); ctx.moveTo(p, y0); ctx.lineTo(p, y1); ctx.stroke(); } } }
    if (ly) { ctx.strokeStyle = '#eeebe4'; for (let e = Math.floor(ya); e < yb; e++) for (let k = 2; k < 10; k++) { const v = e + Math.log10(k); if (v > ya && v < yb) { const p = y1 - (v - ya) / (yb - ya) * (y1 - y0); ctx.beginPath(); ctx.moveTo(x0, p); ctx.lineTo(x1, p); ctx.stroke(); } } }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    xt.forEach((t, i) => {
      const p = x0 + (t - xa) / (xb - xa) * (x1 - x0);
      ctx.strokeStyle = '#d9d5cc'; ctx.beginPath(); ctx.moveTo(p, y0); ctx.lineTo(p, y1); ctx.stroke();
      if (i % xstep === 0) ctx.fillText(lx ? '10' + sup(t) : (o.fmtx ? o.fmtx(t) : minus(+t.toPrecision(6) + '')), p, y1 + 0.25 * R);
    });
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    yt.forEach((t, i) => {
      const p = y1 - (t - ya) / (yb - ya) * (y1 - y0);
      ctx.strokeStyle = '#d9d5cc'; ctx.beginPath(); ctx.moveTo(x0, p); ctx.lineTo(x1, p); ctx.stroke();
      if (i % ystep === 0) ctx.fillText(ly ? '10' + sup(t) : (o.fmty ? o.fmty(t) : minus(+t.toPrecision(6) + '')), x0 - 0.3 * R, p);
    });
    ctx.strokeStyle = '#16181d'; ctx.lineWidth = 1.5; ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
    ctx.fillStyle = '#16181d'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    if (o.xlabel) ctx.fillText(o.xlabel, (x0 + x1) / 2, py + H - 0.05 * R);
    if (o.ylabel) { ctx.save(); ctx.translate(px + 0.1 * R, (y0 + y1) / 2); ctx.rotate(-Math.PI / 2); ctx.textBaseline = 'top'; ctx.fillText(o.ylabel, 0, 0); ctx.restore(); }
    // series
    ctx.beginPath(); ctx.rect(x0, y0, x1 - x0, y1 - y0); ctx.clip();
    for (const s of o.series) {
      ctx.strokeStyle = s.color; ctx.lineWidth = s.width || 3; ctx.setLineDash(s.dash || []);
      ctx.beginPath(); let pen = false;
      for (const [x, y] of s.pts) {
        if (!(isFinite(x) && isFinite(y)) || (lx && x <= 0) || (ly && y <= 0)) { pen = false; continue; }
        const X_ = X(x), Y_ = Math.max(-1e4, Math.min(1e4, Y(y)));
        if (pen) ctx.lineTo(X_, Y_); else { ctx.moveTo(X_, Y_); pen = true; }
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
    if (o.extra) o.extra({ X, Y, x0, x1, y0, y1 });
    ctx.restore();
    // legend
    if (o.legend !== false) {
      const items = o.series.filter((s) => s.label);
      ctx.font = R + 'px system-ui, sans-serif';
      const lw = Math.max(...items.map((s) => ctx.measureText(s.label).width), 0) + 3.2 * R;
      const pos = o.legendPos || 'tr';
      let lxp = pos[1] === 'r' ? x1 - lw - 0.4 * R : x0 + 0.4 * R;
