<div class="app">
  <header><span class="tag">Session 14</span><h1>Boundary Conditions at a Dielectric Interface</h1><div class="modes" id="modes"></div></header>
  <main>
    <div class="stage"><canvas id="cv"></canvas></div>
    <aside class="panel" id="panel">
      <div id="ctl"></div>
      <table class="bc" id="tbl"></table>
      <div class="readout" id="read"></div>
      <div class="formula">
        <div class="eq" data-tex="E_{t1}=E_{t2},\qquad D_{n1}=D_{n2}\ \ (\rho_S=0)"></div>
        <div class="eq" data-tex="\dfrac{\tan\theta_1}{\tan\theta_2}=\dfrac{\varepsilon_{r1}}{\varepsilon_{r2}},\quad \mathbf P=\varepsilon_0(\varepsilon_r-1)\mathbf E"></div>
      </div>
    </aside>
  </main>
  <footer class="notice" id="notice">Tangential E and normal D are continuous; the field bends away from the normal in the higher-ε medium.</footer>
</div>

<!-- ===================== PHYSICS (pure, testable; no DOM) ===================== -->
<script id="physics">
const PHYS = (() => {
  const EPS0 = 8.854e-12;
  // Interface z = 0, region 1 (z>0, eps_r1), region 2 (z<0, eps_r2). Unit normal n = +z (from 2 into 1).
  // Incident field in region 1 given by magnitude E1 and angle theta1 measured from the normal,
  // pointing DOWN into region 2: E1 = (E1 sin th1, -E1 cos th1). No free surface charge.
  function solve(er1, er2, E1, th1) {
    const E1t = E1 * Math.sin(th1), E1n = -E1 * Math.cos(th1);
    const E2t = E1t;                 // tangential E continuous
    const E2n = er1 / er2 * E1n;     // normal D continuous: eps1 E1n = eps2 E2n
    const E2 = Math.hypot(E2t, E2n), th2 = Math.atan2(Math.abs(E2t), Math.abs(E2n));
    const D1t = EPS0 * er1 * E1t, D1n = EPS0 * er1 * E1n, D2t = EPS0 * er2 * E2t, D2n = EPS0 * er2 * E2n;
    const P1n = EPS0 * (er1 - 1) * E1n, P2n = EPS0 * (er2 - 1) * E2n;
    const P1t = EPS0 * (er1 - 1) * E1t, P2t = EPS0 * (er2 - 1) * E2t;
    // bound surface charge on the interface: rho_Sb = P.n_out summed over both media
    // medium 1 outward normal is -z, medium 2 outward normal is +z
    const rhoSb = -P1n + P2n;
    return { E1t, E1n, E2t, E2n, E1, E2, th1, th2, D1t, D1n, D2t, D2n, P1n, P2n, P1t, P2t, rhoSb };
  }
  // energy density w = 1/2 D.E
  const w = (er, Et, En) => 0.5 * EPS0 * er * (Et * Et + En * En);
  return { EPS0, solve, w };
})();
if (typeof module !== 'undefined') module.exports = PHYS;
</script>

<script>/* ===== common UI kit (shared by all sims; no physics here) ===== */
const UI = (() => {

    if (v === 0) return '0';

    const lx = v => o.logx ? Math.log10(v) : v, ly = v => o.logy ? Math.log10(v) : v;
    const [x0, x1] = o.xlim.map(lx), [y0, y1] = o.ylim.map(ly);

  function arrow(ctx, x0, y0, x1, y1, color, w = 2, head = 10) {
    const a = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0); head = Math.min(head, L * 0.6);
    ctx.strokeStyle = ctx.fillStyle = color; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - head * 0.7 * Math.cos(a), y1 - head * 0.7 * Math.sin(a)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - head * Math.cos(a - 0.4), y1 - head * Math.sin(a - 0.4)); ctx.lineTo(x1 - head * Math.cos(a + 0.4), y1 - head * Math.sin(a + 0.4)); ctx.closePath(); ctx.fill();
  }
  // arrowhead in the middle of a polyline segment
  function midHead(ctx, x, y, ang, color, s = 9) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(x + s * Math.cos(ang), y + s * Math.sin(ang));
    ctx.lineTo(x + s * Math.cos(ang + 2.5), y + s * Math.sin(ang + 2.5)); ctx.lineTo(x + s * Math.cos(ang - 2.5), y + s * Math.sin(ang - 2.5)); ctx.closePath(); ctx.fill();
  }
  // perceptual-ish colour map (blue -> cyan -> yellow -> red), t in [0,1]
  function cmap(t) {
    t = Math.max(0, Math.min(1, t));
    const S = [[0, [49, 54, 149]], [0.25, [69, 117, 180]], [0.45, [171, 217, 233]], [0.6, [254, 224, 144]], [0.8, [244, 109, 67]], [1, [165, 0, 38]]];
    for (let i = 1; i < S.length; i++) if (t <= S[i][0]) { const [a, ca] = S[i - 1], [b, cb] = S[i]; const u = (t - a) / (b - a); return ca.map((c, k) => Math.round(c + (cb[k] - c) * u)); }
    return S[S.length - 1][1];
  }
  // marching-squares contour of node field f (nx*ny, row-major f[j*nx+i]); toPx(i,j)->[x,y]; mask(i,j) true = skip cell
  function contour(ctx, f, nx, ny, level, toPx, mask) {
    ctx.beginPath();
    const lerp = (a, b) => (level - a) / (b - a);
    for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      if (mask && mask(i, j)) continue;
      const v0 = f[j * nx + i], v1 = f[j * nx + i + 1], v2 = f[(j + 1) * nx + i + 1], v3 = f[(j + 1) * nx + i];
      const c = (v0 > level) | ((v1 > level) << 1) | ((v2 > level) << 2) | ((v3 > level) << 3);
      if (c === 0 || c === 15) continue;
      const e = [];
      if ((v0 > level) !== (v1 > level)) e.push([i + lerp(v0, v1), j]);
      if ((v1 > level) !== (v2 > level)) e.push([i + 1, j + lerp(v1, v2)]);
      if ((v3 > level) !== (v2 > level)) e.push([i + lerp(v3, v2), j + 1]);
      if ((v0 > level) !== (v3 > level)) e.push([i, j + lerp(v0, v3)]);
      for (let k = 0; k + 1 < e.length; k += 2) { const a = toPx(...e[k]), b = toPx(...e[k + 1]); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
    }
    ctx.stroke();
  }
  function text(ctx, s, x, y, { color = '#1b2333', size, align = 'left', base = 'middle', weight = '', bg = null } = {}) {
    const fz = size || fontPx();
    ctx.font = `${weight} ${fz}px system-ui, sans-serif`; ctx.textAlign = align; ctx.textBaseline = base;
    if (bg) { const wd = ctx.measureText(s).width, x0 = align === 'center' ? x - wd / 2 : align === 'right' ? x - wd : x, y0 = base === 'middle' ? y - fz * 0.6 : base === 'top' ? y - fz * 0.1 : y - fz * 1.1; ctx.fillStyle = bg; ctx.fillRect(x0 - fz * 0.2, y0, wd + fz * 0.4, fz * 1.2); }
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }
  return { $, sci, eng, tex, texAll, contour, fontPx, canvas, pointer, slider, seg, check, plot, arrow, midHead, cmap, text, ticks };
})();
</script>

<!-- ===================== UI / RENDERING ===================== -->
<script id="app">
(() => {
  const { $, sci, eng, tex, texAll, canvas, slider, seg, check, arrow, text, pointer } = UI;
  const S = { er1: 1, er2: 4, th1: 40 * Math.PI / 180, E1: 1e5, lines: 'D', pol: true, comps: true };
  seg('#modes', [['D', 'Show D lines'], ['E', 'Show E lines']], S.lines, v => { S.lines = v; C.redraw(); });
  const c = $('#ctl');
  slider(c, { label: 'ε<sub>r1</sub> (top)', min: 1, max: 12, step: 0.1, value: S.er1, fmt: v => v.toFixed(1), onInput: v => { S.er1 = v; C.redraw(); } });
  slider(c, { label: 'ε<sub>r2</sub> (bottom)', min: 1, max: 12, step: 0.1, value: S.er2, fmt: v => v.toFixed(1), onInput: v => { S.er2 = v; C.redraw(); } });
  const sTh = slider(c, { label: 'Angle θ<sub>1</sub> (drag E₁)', min: 0, max: 85, step: 0.5, value: 40, fmt: v => v.toFixed(1) + '°', onInput: v => { S.th1 = v * Math.PI / 180; C.redraw(); } });
  slider(c, { label: '|E<sub>1</sub>|', min: 10, max: 300, step: 1, value: 100, fmt: v => v + ' kV/m', onInput: v => { S.E1 = v * 1e3; C.redraw(); } });
  const r = document.createElement('div'); r.className = 'row'; c.appendChild(r);
  check(r, 'Polarization &amp; bound charge', true, v => { S.pol = v; C.redraw(); });
  check(r, 'Components', true, v => { S.comps = v; C.redraw(); });

  let geo = null;
  function draw(ctx, w, h) {
    const fs = UI.fontPx(), R = PHYS.solve(S.er1, S.er2, S.E1, S.th1);
    const yI = h * 0.5;
    // region tints (darker = higher eps)
    const tint = er => `rgba(130,80,223,${0.04 + 0.22 * (er - 1) / 11})`;
    ctx.fillStyle = tint(S.er1); ctx.fillRect(0, 0, w, yI);
    ctx.fillStyle = tint(S.er2); ctx.fillRect(0, yI, w, h - yI);
    text(ctx, `Region 1:  ε_r1 = ${S.er1.toFixed(1)}`, fs * 0.6, fs * 0.9, { size: fs, weight: 700, bg: 'rgba(255,255,255,.8)' });
    text(ctx, `Region 2:  ε_r2 = ${S.er2.toFixed(1)}`, fs * 0.6, h - fs * 0.9, { size: fs, weight: 700, bg: 'rgba(255,255,255,.8)' });
    // field lines: direction of (t, n) per region; in canvas y is down so n<0 (downward) => +dy
    const d1 = [R.E1t / R.E1, -R.E1n / R.E1], d2 = [R.E2t / R.E2, -R.E2n / R.E2];
    // spacing along the interface: for D lines identical (D_n continuous); for E lines inversely ∝ E_n
    const s1 = fs * 2.6 / Math.max(0.25, Math.cos(S.th1)) * Math.max(0.6, Math.min(1.6, 1));
    let sp1 = s1, sp2 = s1;
    if (S.lines === 'E') sp2 = s1 * Math.abs(R.E1n / R.E2n);
    const col = S.lines === 'D' ? '#1a7f37' : '#1f6feb';
    const drawSet = (sp, dir, top) => {
      ctx.strokeStyle = col; ctx.lineWidth = 2.2;
      const L = top ? yI / dir[1] : (h - yI) / dir[1]; // length to reach the edge
      const span = Math.abs(dir[0] * L) + w;
      for (let x = -span; x < w + span; x += sp) {
        let x0, y0, x1, y1;
        if (top) { x1 = x; y1 = yI; x0 = x - dir[0] * L; y0 = 0; } else { x0 = x; y0 = yI; x1 = x + dir[0] * L; y1 = h; }
        if (Math.max(x0, x1) < -20 || Math.min(x0, x1) > w + 20) continue;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        const mx = (x0 + x1) / 2, my = (y0 + y1) / 2; UI.midHead(ctx, mx, my, Math.atan2(dir[1], dir[0]), col, fs * 0.5);
      }
    };
    // align a line through the centre point
    const cx = w * 0.5;
    const off1 = ((cx % sp1) + sp1) % sp1, off2 = ((cx % sp2) + sp2) % sp2;
    ctx.save(); ctx.translate(off1, 0); ctx.beginPath(); ctx.rect(-off1, 0, w, yI); ctx.clip(); drawSet(sp1, d1, true); ctx.restore();
    ctx.save(); ctx.translate(off2, 0); ctx.beginPath(); ctx.rect(-off2, yI, w, h - yI); ctx.clip(); drawSet(sp2, d2, false); ctx.restore();
    // polarization dipoles + bound charge
    if (S.pol) {
      const Pmax = Math.max(Math.hypot(R.P1n, R.P1t), Math.hypot(R.P2n, R.P2t), 1e-30);
      const dip = (x, y, Pt, Pn) => { const m = Math.hypot(Pt, Pn); if (m < 1e-30) return; const L = fs * 1.4 * m / Pmax; const ux = Pt / m, uy = -Pn / m; ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(uy, ux)); ctx.fillStyle = 'rgba(31,111,235,.55)'; ctx.beginPath(); ctx.ellipse(-L * 0.25, 0, L * 0.3, fs * 0.28, 0, 0, 7); ctx.fill(); ctx.fillStyle = 'rgba(209,36,47,.55)'; ctx.beginPath(); ctx.ellipse(L * 0.25, 0, L * 0.3, fs * 0.28, 0, 0, 7); ctx.fill(); ctx.restore(); };
      for (let x = fs * 2; x < w; x += fs * 4.2) { for (let k = 1; k <= 2; k++) { dip(x + (k % 2) * fs * 2.1, yI - k * fs * 2.4, R.P1t, R.P1n); dip(x + (k % 2) * fs * 2.1, yI + k * fs * 2.4, R.P2t, R.P2n); } }
    }
    // interface
    ctx.strokeStyle = '#1b2333'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, yI); ctx.lineTo(w, yI); ctx.stroke();
    if (S.pol) {
      // bound charge row
      const sb = R.rhoSb; if (Math.abs(sb) > 1e-15) {
        const n = Math.min(Math.floor(w / (fs * 1.6)), Math.max(1, Math.round(Math.abs(sb) / (S.E1 * PHYS.EPS0) * 30))); const sym = sb > 0 ? '+' : '−';
        ctx.fillStyle = sb > 0 ? '#d1242f' : '#1f6feb'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for (let i = 0; i < n; i++) { const xx = (i + 0.5) * w / n; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(xx, yI, fs * 0.55, 0, 7); ctx.fill(); ctx.fillStyle = sb > 0 ? '#d1242f' : '#1f6feb'; ctx.font = `900 ${fs * 1.3}px system-ui`; ctx.fillText(sym, xx, yI); }
      }
    
    }
    // vector diagram at the centre
    const Emax = Math.max(R.E1, R.E2), Lr = Math.min(h * 0.38, w * 0.3) / Emax;
    const tip1 = [cx - R.E1t * Lr, yI + R.E1n * Lr]; // E1 drawn ending at the interface point
    // normal
    ctx.strokeStyle = '#5a6478'; ctx.setLineDash([6, 5]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx, yI - h * 0.45); ctx.lineTo(cx, yI + h * 0.45); ctx.stroke(); ctx.setLineDash([]);
    text(ctx, 'normal', cx + fs * 0.3, yI - h * 0.43, { size: fs * 0.8, color: '#5a6478', bg: 'rgba(255,255,255,.8)' });
    arrow(ctx, tip1[0], tip1[1], cx, yI, '#d1242f', 4.5, fs * 0.9);
    const e2 = [cx + R.E2t * Lr, yI - R.E2n * Lr];
    arrow(ctx, cx, yI, e2[0], e2[1], '#d1242f', 4.5, fs * 0.9);
    if (S.comps) {
      ctx.setLineDash([4, 4]); ctx.lineWidth = 2;
      ctx.strokeStyle = '#b35900'; ctx.beginPath(); ctx.moveTo(tip1[0], tip1[1]); ctx.lineTo(cx, tip1[1]); ctx.moveTo(cx, yI); ctx.lineTo(e2[0], yI); ctx.stroke(); // tangential
      ctx.strokeStyle = '#8250df'; ctx.beginPath(); ctx.moveTo(e2[0], yI); ctx.lineTo(e2[0], e2[1]); ctx.stroke();
      ctx.setLineDash([]);
      text(ctx, 'E_t1', (tip1[0] + cx) / 2, tip1[1] - fs * 0.7, { align: 'center', color: '#b35900', size: fs * 0.85, weight: 700, bg: 'rgba(255,255,255,.85)' });
      text(ctx, 'E_t2', (e2[0] + cx) / 2, yI + fs * 0.9, { align: 'center', color: '#b35900', size: fs * 0.85, weight: 700, bg: 'rgba(255,255,255,.85)' });
      text(ctx, 'E_n2', e2[0] + fs * 0.4, (yI + e2[1]) / 2, { color: '#8250df', size: fs * 0.85, weight: 700, bg: 'rgba(255,255,255,.85)' });
    }
    // angle arcs
    const arc = (a0, a1, rad, lab, y) => { ctx.strokeStyle = '#1b2333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, yI, rad, a0, a1, a1 < a0); ctx.stroke(); text(ctx, lab, cx + rad * 1.25 * Math.cos((a0 + a1) / 2), yI + rad * 1.25 * Math.sin((a0 + a1) / 2), { align: 'center', size: fs, weight: 700, bg: 'rgba(255,255,255,.85)' }); };
    if (S.th1 > 0.02) arc(-Math.PI / 2, -Math.PI / 2 - S.th1, fs * 3, 'θ₁');
    if (R.th2 > 0.02) arc(Math.PI / 2, Math.PI / 2 - R.th2, fs * 3, 'θ₂');
    text(ctx, 'E₁', tip1[0] - fs * 0.4, tip1[1] - fs * 0.4, { align: 'right', color: '#d1242f', size: fs * 1.1, weight: 800, bg: 'rgba(255,255,255,.85)' });
    text(ctx, 'E₂', e2[0] + fs * 0.5, e2[1] + fs * 0.4, { color: '#d1242f', size: fs * 1.1, weight: 800, bg: 'rgba(255,255,255,.85)' });
    // drag handle at tail of E1
    ctx.fillStyle = '#d1242f'; ctx.beginPath(); ctx.arc(tip1[0], tip1[1], fs * 0.45, 0, 7); ctx.fill();
    geo = { cx, yI, tip1 };
    text(ctx, (S.lines === 'D' ? 'D lines: same count both sides (no free charge)' : 'E lines: some start/end on bound charge'), w - fs * 0.6, fs * 0.9, { align: 'right', size: fs * 0.85, color: col, weight: 700, bg: 'rgba(255,255,255,.85)' });
    // table
    const k = v => (v / 1e3).toFixed(1), dn = v => (v * 1e6).toFixed(3);
    $('#tbl').innerHTML = `<tr><th></th><th>Region 1</th><th>Region 2</th><th></th></tr>
      <tr><th>E<sub>t</sub> kV/m</th><td>${k(R.E1t)}</td><td>${k(R.E2t)}</td><td class="c">=</td></tr>
      <tr><th>E<sub>n</sub> kV/m</th><td>${k(-R.E1n)}</td><td>${k(-R.E2n)}</td><td class="j">${Math.abs(S.er1 - S.er2) < 1e-9 ? '=' : '≠'}</td></tr>
      <tr><th>D<sub>t</sub> µC/m²</th><td>${dn(R.D1t)}</td><td>${dn(R.D2t)}</td><td class="j">${Math.abs(S.er1 - S.er2) < 1e-9 ? '=' : '≠'}</td></tr>
      <tr><th>D<sub>n</sub> µC/m²</th><td>${dn(-R.D1n)}</td><td>${dn(-R.D2n)}</td><td class="c">=</td></tr>
      <tr><th>θ</th><td>${(S.th1 * 180 / Math.PI).toFixed(1)}°</td><td>${(R.th2 * 180 / Math.PI).toFixed(1)}°</td><td></td></tr>`;
    const tr = Math.tan(S.th1) / Math.tan(R.th2);
    $('#read').innerHTML = `tan θ₁ / tan θ₂ = <b>${isFinite(tr) && S.th1 > 1e-3 ? tr.toFixed(3) : '—'}</b> &nbsp; ε<sub>r1</sub>/ε<sub>r2</sub> = <b>${(S.er1 / S.er2).toFixed(3)}</b><br>bound ρ<sub>S,b</sub> = <b>${(R.rhoSb * 1e6).toFixed(3)} µC/m²</b>`;
  }
  const C = canvas($('#cv'), draw);
  pointer($('#cv'), {
    down: p => { if (!geo) return false; if (Math.hypot(p.x - geo.tip1[0], p.y - geo.tip1[1]) > UI.fontPx() * 1.5) return false; },
    move: p => { const dx = geo.cx - p.x, dy = geo.yI - p.y; if (dy <= 0) return; const a = Math.atan2(Math.max(0, dx), dy) * 180 / Math.PI; sTh.set(Math.max(0, Math.min(85, a))); },
  });
  texAll();
})();
</script>
